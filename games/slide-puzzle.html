<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Собери чистый экран - Slide Puzzle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            max-width: 700px;
            width: 100%;
        }
        .header { text-align: center; margin-bottom: 20px; }
        h1 { color: #56ab2f; margin-bottom: 10px; }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            color: #56ab2f;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
        }
        .score-item { text-align: center; }
        .score-label { font-size: 0.9em; color: #666; }
        .score-value { font-size: 1.5em; font-weight: bold; color: #56ab2f; }
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: #f5f5f5;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        #winModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
        }
        .modal-btn {
            background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            margin: 10px;
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="location.href='../index.html'">← Назад</button>
    <div class="game-container">
        <div class="header">
            <h1>🧩 Собери чистый экран</h1>
            <p>Двигайте плитки и собирайте совпадения!</p>
        </div>
        <div class="score-board">
            <div class="score-item"><div class="score-label">Очки</div><div class="score-value" id="score">0</div></div>
            <div class="score-item"><div class="score-label">Уровень</div><div class="score-value" id="level">1</div></div>
            <div class="score-item"><div class="score-label">Ходы</div><div class="score-value" id="moves">50</div></div>
        </div>
        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </div>
    <div id="winModal">
        <div class="modal-content">
            <h2>🎉 Уровень пройден!</h2>
            <p id="modalMsg"></p>
            <button class="modal-btn" onclick="nextLevel()">Следующий</button>
            <button class="modal-btn" onclick="location.href='../index.html'">Меню</button>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const SIZE = 5, CELL = 120;
        let score = 0, level = 1, moves = 50, grid = [], emptyPos = {r: SIZE-1, c: SIZE-1};

        const types = [
            {emoji: '🎵', color: '#FF6B6B'}, {emoji: '🎬', color: '#4ECDC4'},
            {emoji: '🚖', color: '#45B7D1'}, {emoji: '🛡️', color: '#FFA07A'},
            {emoji: '📱', color: '#F7DC6F'}
        ];

        function lightenColor(color, factor) {
            const hex = color.replace('#', '');
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);
            return `rgb(${Math.min(255, Math.floor(r + (255 - r) * factor))}, ${Math.min(255, Math.floor(g + (255 - g) * factor))}, ${Math.min(255, Math.floor(b + (255 - b) * factor))})`;
        }

        function darkenColor(color, factor) {
            const hex = color.replace('#', '');
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);
            return `rgb(${Math.floor(r * (1 - factor))}, ${Math.floor(g * (1 - factor))}, ${Math.floor(b * (1 - factor))})`;
        }



        function init() {
            grid = [];
            moves = 50;
            emptyPos = {r: SIZE-1, c: SIZE-1};

            for (let r = 0; r < SIZE; r++) {
                grid[r] = [];
                for (let c = 0; c < SIZE; c++) {
                    if (r === SIZE-1 && c === SIZE-1) {
                        grid[r][c] = null;
                    } else {
                        grid[r][c] = types[Math.floor(Math.random() * types.length)];
                    }
                }
            }

            draw();
            updateScore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c]) {
                        ctx.fillStyle = grid[r][c].color;
                        ctx.fillRect(c * CELL + 2, r * CELL + 2, CELL - 4, CELL - 4);
                        ctx.strokeStyle = 'white';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(c * CELL + 2, r * CELL + 2, CELL - 4, CELL - 4);
                        ctx.save();
                        ctx.font = 'bold 50px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", Arial, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
                        ctx.shadowBlur = 4;
                        ctx.shadowOffsetX = 1;
                        ctx.shadowOffsetY = 1;
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                        ctx.fillText(grid[r][c].emoji, c * CELL + CELL/2, r * CELL + CELL/2);
                        ctx.restore();
                    } else {
                        ctx.fillStyle = '#ddd';
                        ctx.fillRect(c * CELL + 2, r * CELL + 2, CELL - 4, CELL - 4);
                    }
                }
            }
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const c = Math.floor((e.clientX - rect.left) / CELL);
            const r = Math.floor((e.clientY - rect.top) / CELL);

            if ((Math.abs(r - emptyPos.r) === 1 && c === emptyPos.c) ||
                (Math.abs(c - emptyPos.c) === 1 && r === emptyPos.r)) {
                grid[emptyPos.r][emptyPos.c] = grid[r][c];
                grid[r][c] = null;
                emptyPos = {r, c};
                moves--;
                checkMatches();
                draw();
                updateScore();
                checkWin();
            }
        });

        function checkMatches() {
            // Check horizontal matches
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c <= SIZE - 3; c++) {
                    if (grid[r][c] && grid[r][c+1] && grid[r][c+2]) {
                        if (grid[r][c] === grid[r][c+1] && grid[r][c] === grid[r][c+2]) {
                            score += 30;
                            grid[r][c] = null;
                            grid[r][c+1] = null;
                            grid[r][c+2] = null;
                        }
                    }
                }
            }

            // Check vertical matches
            for (let c = 0; c < SIZE; c++) {
                for (let r = 0; r <= SIZE - 3; r++) {
                    if (grid[r][c] && grid[r+1][c] && grid[r+2][c]) {
                        if (grid[r][c] === grid[r+1][c] && grid[r][c] === grid[r+2][c]) {
                            score += 30;
                            grid[r][c] = null;
                            grid[r+1][c] = null;
                            grid[r+2][c] = null;
                        }
                    }
                }
            }
        }

        function checkWin() {
            let hasBlocks = false;
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c]) hasBlocks = true;
                }
            }

            if (!hasBlocks || moves <= 0) {
                setTimeout(() => {
                    document.getElementById('modalMsg').textContent = `Вы набрали ${score} очков!`;
                    document.getElementById('winModal').style.display = 'flex';
                }, 500);
            }
        }

        function nextLevel() {
            document.getElementById('winModal').style.display = 'none';
            level++;
            init();
        }

        function updateScore() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('moves').textContent = moves;
        }

        init();
    </script>
</body>
</html>
